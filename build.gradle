plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// "shade": jar'in icine gomulen kutuphaneler (NanoVG + native kutuphaneleri).
// Minecraft LWJGL cekirdegini kendisi getirir, ama lwjgl-nanovg'i getirmez.
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // transitive=false: lwjgl cekirdegi (Minecraft'ta zaten var) jar'a girmesin
    shade("org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}") { transitive = false }
    ['natives-windows', 'natives-windows-arm64',
     'natives-linux', 'natives-linux-arm64',
     'natives-macos', 'natives-macos-arm64'].each { n ->
        shade("org.lwjgl:lwjgl-nanovg:${project.lwjgl_version}:${n}") { transitive = false }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // NanoVG sinif ve native dosyalarini mod jar'ina gom
    from({
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/**', 'module-info.class'
    }
}
